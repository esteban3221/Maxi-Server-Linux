[package]
name = "essp_driver"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1.0.205"
aes = "0.9.4"
getrandom = "0.3"

[target.'cfg(not(target_os = "espidf"))'.dependencies]
serialport = "4.5"

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-sys = { version = "0.38.1", features = ["binstart"] }

[build-dependencies]
cc = "1.11.3"
cxx-build = "1.0"